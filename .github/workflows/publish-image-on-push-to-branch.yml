name: 'Publish image to GHCR on push to branch'

on:
  push:
    branches-ignore:
      - 'main'

concurrency:
  group: scaler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_push:
    permissions:
      packages: write
      security-events: write
      contents: read
    uses: dBildungsplattform/dbp-github-workflows/.github/workflows/image-publish-trivy.yaml@f45a5de96da86535b161f0bce2ce9ba88fbbfad3
    with:
      image_name: "infra-autoscaler"
      run_trivy_scan: true
      run_clamav_scan: true
      image_tag_generation: "ticket_from_branch"
      add_latest_tag: false
      container_registry: "ghcr.io"
      limit-severities-for-sarif: true
      ignore-unfixed: true
